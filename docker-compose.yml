version: "3.8"

services:
  # A single Quickwit node with every service enabled, so the plugin can be exercised against a real
  # cluster. The REST API answers on 7280, which is the port the task examples use.
  # https://quickwit.io/docs/get-started/installation
  quickwit:
    image: quickwit/quickwit:latest
    environment:
      # a single node runs every service in one process; no discovery to configure
      QW_CLUSTER_ID: quickwit-local
      QW_NODE_ID: quickwit-node-1
      QW_DATA_DIR: /quickwit-data
      QW_SERVICES: indexer searcher janitor metastore ingester
      QW_PEER_SEEDS: quickwit-node-1
    ports:
      - "7280:7280"
    volumes:
      - quickwit-data:/quickwit-data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: server local
    ports:
      - "8080:8080"
    volumes:
      - ./build/libs/:/app/plugins/
    # works around "Unable to create JFR repository directory using base
    # location (/tmp)" on some hosts, see kestra-io/kestra#17405
    tmpfs:
      - /tmp

volumes:
  quickwit-data: